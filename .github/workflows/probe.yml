name: Wind-Probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://photon.komoot.io/api/?q=M%C3%BCnchen&lang=de&limit=6" \
            "https://photon.komoot.io/api/?q=M%C3%BCnchen&lang=de&limit=8&lat=52.473&lon=13.403&zoom=11" \
            "https://photon.komoot.io/api/?q=Tempelhofer%20Feld&lang=de&limit=8&lat=52.473&lon=13.403&zoom=11" \
            "https://photon.komoot.io/api/?q=12049&lang=de&limit=8&lat=52.473&lon=13.403&zoom=11"; do
            echo "PROBE URL $u"
            curl -s -o /tmp/r.json -w "PROBE STATUS %{http_code}\n" -H "Origin: https://grobie.github.io" -D /tmp/h.txt "$u"
            grep -i "access-control" /tmp/h.txt | sed 's/^/PROBE HDR /'
            python3 -c "
          import json;d=json.load(open('/tmp/r.json'))
          for f in d.get('features',[]):
              p=f['properties'];print('PROBE  ',p.get('name'),'|',p.get('type'),'|',p.get('osm_key'),p.get('osm_value'),'|',p.get('postcode'),p.get('city'),p.get('district'),p.get('state'))
          " 2>&1 | sed 's/^/PROBE /' | head -12 || head -c 300 /tmp/r.json
          done
